[project]
name = "nonebot-plugin-maimai-raking"
version = "0.1.5"
description = "一个基于 NoneBot2 的舞萌 DX 分群排行榜插件"
authors = [
    {name = "yukko"},
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.0.0",
    "nonebot-plugin-apscheduler>=0.3.0",
    "nonebot-plugin-localstore>=0.1.0",
    "httpx>=0.23.0",
    "pillow>=9.0.0",
    "pilmoji>=2.0.0",
    "pydantic>=1.10.0",
    "aiosqlite>=0.19.0",
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
keywords = ["nonebot", "nonebot2", "nonebot-plugin", "maimai", "maimaidx", "舞萌"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yukko233/nonebot_plugin_maimai_raking"
Repository = "https://github.com/yukko233/nonebot_plugin_maimai_raking"
Issues = "https://github.com/yukko233/nonebot_plugin_maimai_raking/issues"

[project.entry-points."nonebot.plugin"]
nonebot-plugin-maimai-raking = "nonebot_plugin_maimai_raking"
nonebot_plugin_maimai_raking = "nonebot_plugin_maimai_raking"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_maimai_raking"]

[tool.nonebot]
plugins = ["nonebot_plugin_maimai_raking"]
adapters = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

